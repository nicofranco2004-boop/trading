; ⚠️ ESTE ARCHIVO EXISTE PARA QUE `pytest` A SECAS NO PUEDA MANDAR UN MAIL.
;
; No había NINGUNA config de pytest en el repo, así que `pytest` sin argumentos
; colectaba todo el árbol — incluido `backend/scripts/`, donde hay tres archivos
; que se llaman `test_*.py` y NO son tests: son scripts para correr a mano.
;
;   scripts/test_emails.py                  🔴 manda 3 mails REALES por Resend, y
;                                              su import hace load_dotenv(override=True):
;                                              con sólo COLECTARLO, las credenciales
;                                              de producción pisan el entorno de
;                                              toda la corrida.
;   scripts/test_bot_profile_boundaries.py     su helper `fail()` hace sys.exit(1)
;   scripts/test_proration_edge_cases.py
;
; Son 47 pseudo-tests. Con ellos la suite no terminaba; sin ellos corre entera en
; ~52 s. Durante siete rondas se dio por hecho que "la suite muere al 23-28%" y
; toda la verificación se hizo sobre ~44 archivos elegidos a mano. Nunca fue la
; suite: era la colección.
;
; POR QUÉ LAS DOS LÍNEAS Y NO UNA:
;   · `testpaths` gobierna la invocación SIN argumentos, que es la que usa
;     cualquiera que escriba `pytest` en esta carpeta.
;   · `norecursedirs` cubre la que SÍ lleva argumentos (`pytest .`, `pytest -k algo`),
;     donde `testpaths` se ignora. Con una sola de las dos, el caso peligroso
;     —el mail— sigue disponible por la otra puerta.
;
; Los tres scripts siguen siendo ejecutables a mano, que es para lo que están:
;   python3 backend/scripts/test_emails.py alguien@ejemplo.com
[pytest]
testpaths = tests
norecursedirs = scripts .git node_modules __pycache__ .pytest_cache venv .venv
