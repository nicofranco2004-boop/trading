# Railway deploy config.
# ⚠️ Lo que está acá PISA lo que diga el panel de Railway… HASTA EL 2026-12-01.
# Ese día Railway deja de leer este archivo («Existing Config as Code files stop
# being read on 2026-12-01 (hard cutoff)», docs.railway.com/infrastructure-as-code)
# y manda el panel. Por eso cada ajuste de abajo tiene que estar TAMBIÉN en el
# panel o en las variables del servicio antes de esa fecha: la tabla y los clicks
# están en audit/RAILWAY_SIN_CONFIG_AS_CODE.md, y lo vigila
# backend/tests/test_imagen_de_produccion.py.
#
# La imagen sale del `Dockerfile` de la raíz (antes: Nixpacks + nixpacks.toml,
# que Railway ya no ofrece). Un Dockerfile en la raíz Railway lo usa siempre, con
# o sin este archivo: el `builder` de acá sólo lo hace explícito mientras se lea.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "on_failure"

# Chequeo de salud. Railway le pasa tráfico a una copia nueva recién cuando
# /api/health contesta 200, y /api/health contesta 503 hasta que terminó el
# arranque (esquema + reparaciones: `init_db`). Sin esto, Railway da a la copia
# por lista apenas arranca el contenedor, con la app todavía sin puerto abierto.
#   · Con SQLite + volumen (hoy): Railway apaga la vieja ANTES de prender la
#     nueva (no comparten volumen), así que el corte al publicar sigue igual.
#     Lo que cambia: si la copia nueva no llega a contestar, la publicación
#     queda marcada FALLIDA en vez de «activa» y rota.
#   · Con Postgres sin volumen: la vieja sigue atendiendo hasta que la nueva
#     contesta 200 → sin corte. Por eso el arranque no puede trabar tablas
#     (main._init_db_postgres / _aplicar_esquema_pg).
healthcheckPath = "/api/health"
# 300 s, el valor por defecto de Railway, escrito para que se vea. El arranque
# contra Supabase midió ~40 s sólo para aplicar el esquema completo (el que
# corre cuando cambia schema_pg.sql) y puede sumar reintentos por tabla ocupada
# (hasta 20 × ~4 s). Un tope corto marca como fallida una copia sana.
healthcheckTimeout = 300

# Cuánto le da Railway a la copia VIEJA, después de avisarle que se apague
# (SIGTERM), antes de matarla (SIGKILL). Por defecto son 0 segundos
# (docs.railway.com/reference/deployments: «By default, it is given 0 seconds»),
# o sea que la mata en el acto y el apagado ordenado de la app NUNCA corre:
#   · `_cerrar_al_apagar` baja a la base los últimos precios que tiene en memoria
#     (hasta ~1 minuto: sin eso, los activos que hoy no cotizan vuelven a mostrarse
#     al costo hasta que el mercado abra) y espera hasta 20 s
#     (`CORRIDAS_ESPERA_AL_APAGAR_SEG`) a las alertas, los avisos y los mails en
#     fila, que se marcan como enviados ANTES de mandarse: cortados a mitad, el
#     resto no sale nunca;
#   · uvicorn, antes de eso, deja terminar los pedidos que estaban en curso (un
#     import a mitad de confirmar).
# 30 s cubre los 20 s de las corridas más los pedidos en curso. No es una espera
# fija: si no hay nada en vuelo, la copia vieja se va enseguida.
drainingSeconds = 30
